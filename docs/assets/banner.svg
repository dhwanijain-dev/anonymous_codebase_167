    <rect x="28" y="95" width="115" height="104" rx="10" fill="#193d43" stroke="#80c8b4" stroke-width="2"/>
    <rect x="36" y="103" width="99" height="88" rx="5" fill="url(#grid)"/>
    <path d="M43 165l27-25 19 13 19-29 25 19v48H43z" fill="#67a77c" fill-opacity=".75"/>
    <path d="M143 147h39m-20-20v40" stroke="#e1ce85" stroke-width="3"/>
    <g transform="translate(192 115)">
      <rect x="0" y="0" width="66" height="54" rx="8" fill="#e8cb7b" stroke="#ffebad" stroke-width="2"/>
      <path d="M22 0v54M44 0v54M0 18h66M0 36h66" stroke="#876b32" stroke-width="2"/>
      <path d="M-16 17h16v20h-16zm82 0h16v20H66z" fill="#668fba" stroke="#b8d2e7" stroke-width="2"/>
