<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">SatQuery AI</title>
  <desc id="desc">An illustrated satellite orbiting an abstract remote-sensing grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f2a"/><stop offset="1" stop-color="#123b38"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be5bc" stop-opacity=".28"/><stop offset="1" stop-color="#73b5d9" stop-opacity=".03"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a7dfcb" stroke-opacity=".15"/><circle cx="3" cy="3" r="1.4" fill="#e2cf83" fill-opacity=".65"/></pattern>
  </defs>
  <rect width="1440" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1182" cy="174" r="215" fill="url(#glow)"/>
