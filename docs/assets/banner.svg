  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="88" y="138" fill="#9be5bc" font-size="17" font-weight="700" letter-spacing="5">REMOTE SENSING · NATURAL LANGUAGE</text>
    <text x="84" y="219" fill="#f1f7f3" font-size="61" font-weight="700" letter-spacing="-2">SatQuery AI</text>
    <text x="89" y="268" fill="#c3d8cf" font-size="22">Ask questions about satellite imagery in plain language.</text>
    <path d="M88 299h310" stroke="#9be5bc" stroke-width="3" stroke-linecap="round"/>
